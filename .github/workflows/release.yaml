name: release

# ponytail: Linux/macOS only, CPU-only Linux, unsigned macOS -- see README's
# Release install section for the full scope note and upgrade path (Windows,
# GPU backends, macOS signing/notarization). Trimmed down from upstream's
# full matrix (Windows + CUDA/ROCm/Vulkan/MLX/Jetpack Linux + Docker image
# publish), which needs infra this fork doesn't have: a Windows Authenticode
# cert, an Apple Developer ID, and a Docker Hub account for the registry
# build-cache upstream's linux-depends job pushes to.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed in GOFLAGS when run manually (no tag push) -- e.g. 0.0.1-test'
        required: true

env:
  CGO_CFLAGS: '-O3'
  CGO_CXXFLAGS: '-O3'

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      GOFLAGS: ${{ steps.goflags.outputs.GOFLAGS }}
      VERSION: ${{ steps.goflags.outputs.VERSION }}
      vendorsha: ${{ steps.goflags.outputs.vendorsha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set environment
        id: goflags
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo GOFLAGS="'-ldflags=-w -s \"-X=github.com/borism/ollama-cluster/version.Version=${VERSION}\" \"-X=github.com/borism/ollama-cluster/server.mode=release\"'" | tee -a $GITHUB_OUTPUT
          echo VERSION="${VERSION}" | tee -a $GITHUB_OUTPUT
          echo vendorsha=$(cat LLAMA_CPP_VERSION)-$(cat MLX_VERSION)-$(cat MLX_C_VERSION) | tee -a $GITHUB_OUTPUT

  darwin-build:
    runs-on: macos-26-xlarge
    environment: release
    needs: setup-environment
    env:
      GOFLAGS: ${{ needs.setup-environment.outputs.GOFLAGS }}
      VERSION: ${{ needs.setup-environment.outputs.VERSION }}
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      CGO_CFLAGS: '-mmacosx-version-min=14.0 -O3'
      CGO_CXXFLAGS: '-mmacosx-version-min=14.0 -O3'
      CGO_LDFLAGS: '-mmacosx-version-min=14.0 -O3'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${DEVELOPER_DIR}" ]; then
            echo "Missing ${DEVELOPER_DIR}"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "${DEVELOPER_DIR}"
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --find metal
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION
      - run: |
          cmake -S . -B build/go-license -DOLLAMA_LLAMA_BACKENDS= -DOLLAMA_MLX_BACKENDS= -DOLLAMA_PAYLOAD_INSTALL_PREFIX=dist/darwin-arm64 "-DOLLAMA_GO_LICENSE_TARGETS=darwin/amd64;darwin/arm64"
          cmake --build build/go-license --target ollama-go-license
          # build+package only -- no `sign` (needs Apple Developer ID/notarization
          # secrets this fork doesn't have) and no `app` (the signed menu-bar
          # .app; needs npm and would be Gatekeeper-blocked unsigned anyway).
          ./scripts/build_darwin.sh build package
      - name: Repackage as bin/+lib/ollama (matches the Linux tarball shape)
        # build_darwin.sh's own ollama-darwin.tgz is a flat layout (kept for
        # other internal tooling, see .github/scripts/prepare_mlx_darwin.sh)
        # -- ml/path.go's darwin candidate list also accepts the standard
        # bin/+lib/ollama layout (exeDir/../lib/ollama), so install.sh can
        # share one download+extract routine across both OSes instead of
        # needing a macOS-specific layout.
        run: |
          rm -rf pkg
          mkdir -p pkg/bin pkg/lib/ollama
          cp dist/darwin/ollama pkg/bin/ollama
          cp dist/darwin/llama-server dist/darwin/llama-quantize pkg/lib/ollama/
          cp -a dist/darwin/lib/ollama/. pkg/lib/ollama/
          tar czf dist/ollama-darwin.tgz -C pkg bin lib
      - name: Log build results
        run: |
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-darwin
          path: dist/ollama-darwin.tgz

  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    needs: setup-environment
    env:
      GOFLAGS: ${{ needs.setup-environment.outputs.GOFLAGS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION
      - run: sudo apt-get update && sudo apt-get install -y cmake ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-linux-${{ matrix.arch }}-${{ needs.setup-environment.outputs.vendorsha }}
      - name: Build CPU-only native superbuild
        # ponytail: CPU only -- CUDA/ROCm/Vulkan need per-backend SDK
        # containers (see test.yaml's linux matrix) this job doesn't set up
        # yet. Upgrade path: add matrix entries the same way, each still on
        # ubuntu-latest/ubuntu-24.04-arm (Docker containers work fine on
        # GitHub-hosted runners for a compile-only build -- no GPU needed).
        run: |
          cmake -S . -B build/local-superbuild
          CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) cmake --build build/local-superbuild --target ollama-local -- -l $(nproc)
      - name: Package
        run: |
          mkdir -p dist pkg
          cmake --install build/local-superbuild --component ollama-local --prefix pkg
          pkg/bin/ollama --version
          pkg/lib/ollama/llama-server --version
          tar czf dist/ollama-linux-${{ matrix.arch }}.tgz -C pkg bin lib
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux-${{ matrix.arch }}
          path: dist/*.tgz

  # Final release process
  release:
    # workflow_dispatch runs (see the top-level `on:`) exist to iterate on
    # the build jobs above without cutting a real tag -- GITHUB_REF_NAME
    # there is a branch name, not a version, so this job (which publishes a
    # GitHub Release named after the tag) only makes sense for an actual
    # tag push.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    needs: [darwin-build, linux-build]
    concurrency:
      group: release-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: Log dist contents
        run: |
          ls -l dist/
      - name: Copy install scripts to dist
        run: |
          cp scripts/install.sh dist/install.sh
      - name: Verify release artifacts
        run: |
          required=(
            dist/install.sh
            dist/ollama-linux-amd64.tgz
            dist/ollama-linux-arm64.tgz
            dist/ollama-darwin.tgz
          )
          for payload in "${required[@]}"; do
            if [ ! -f "$payload" ]; then
              echo "::error::Missing expected release artifact: $payload"
              exit 1
            fi
          done
      - name: Generate checksum file
        run: find . -type f -not -name 'sha256sum.txt' | xargs sha256sum | tee sha256sum.txt
        working-directory: dist
      - name: Publish release artifacts
        shell: bash
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Attempt $attempt failed; retrying in $((attempt * 15))s: $*"
                sleep "$((attempt * 15))"
              fi
            done
            echo "::error::Failed after 3 attempts: $*"
            return 1
          }

          delete_assets() {
            local assets asset
            # Re-list on each attempt: a failed DELETE may still have removed the asset.
            assets=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$1/assets" --jq '.[].url') || return 1
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              gh api --method DELETE "$asset" || return 1
            done <<< "$assets"
          }

          RELEASE_VERSION="${GITHUB_REF_NAME%%-*}"
          echo "Looking for existing release for ${RELEASE_VERSION}"
          OLD_TAG=$(gh release ls --json name,tagName | jq -r --arg version "$RELEASE_VERSION" '.[] | select(.name == $version) | .tagName')
          if [ -n "$OLD_TAG" ]; then
            RELEASE_ID=$(gh release view "$OLD_TAG" --json databaseId --jq .databaseId)
            echo "Deleting old assets from ${OLD_TAG}"
            retry delete_assets "$RELEASE_ID"
            echo "Updating release ${RELEASE_VERSION} to point to new tag ${GITHUB_REF_NAME}"
            gh release edit "$OLD_TAG" --tag "$GITHUB_REF_NAME"
          else
            echo "Creating new release ${RELEASE_VERSION} pointing to tag ${GITHUB_REF_NAME}"
            gh release create "$GITHUB_REF_NAME" \
              --title "$RELEASE_VERSION" \
              --draft \
              --generate-notes \
              --prerelease
          fi

          shopt -s nullglob
          pids=()
          for payload in dist/*.txt dist/*.tgz dist/*.sh ; do
            # Publish the checksum manifest only after every payload has succeeded.
            [ "$payload" = dist/sha256sum.txt ] && continue
            echo "Uploading $payload"
            retry gh release upload "$GITHUB_REF_NAME" "$payload" --clobber &
            pids+=($!)
            sleep 1
          done
          echo "Waiting for uploads to complete"
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait $pid; then
              echo "::error::Upload failed (pid $pid)"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "One or more uploads failed"
            exit 1
          fi
          retry gh release upload "$GITHUB_REF_NAME" dist/sha256sum.txt --clobber
          echo "done"
